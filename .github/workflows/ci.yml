name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [published]
  repository_dispatch:
    types: [build-chain, upstream-changed]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip test execution and coverage steps'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  # Match blvm-node: incremental fills runner disks under shared target dirs.
  CARGO_INCREMENTAL: '0'

jobs:
  setup:
    name: Setup
    runs-on: [self-hosted, Linux, X64, builds]
    if: |
      (github.event_name != 'push' || github.event.head_commit == null || 
       (!contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[ci skip]') &&
        !contains(github.event.head_commit.message, '[no ci]')))
    outputs:
      cache-key: ${{ steps.setup-cache.outputs.cache-key }}
    steps:
      - name: Disk check
        uses: BTCDecoded/rust-ci/runner-disk-guard@main

      - uses: actions/checkout@v4
      

      - name: Strip [patch.crates-io] for crates.io-only CI
        uses: BTCDecoded/rust-ci/strip-patch-crates-io@main
      - name: Cache
        id: setup-cache
        run: |
          CACHE_ROOT="/tmp/runner-cache"
          
          # Generate cache key from Cargo.toml (library crate does not commit Cargo.lock)
          DEPS_KEY=$(sha256sum Cargo.toml | cut -d' ' -f1)
          
          # Include toolchain version in cache key
          TOOLCHAIN=$(grep -E '^channel|rust-version' rust-toolchain.toml Cargo.toml 2>/dev/null | head -1 | sha256sum | cut -d' ' -f1 || echo "1.88.0")
          
          CACHE_KEY="${DEPS_KEY}-${TOOLCHAIN}"
          
          # Set up cache directories
          CARGO_CACHE_DIR="$CACHE_ROOT/cargo/$CACHE_KEY"
          TARGET_CACHE_DIR="$CACHE_ROOT/target/$CACHE_KEY"
          
          echo "CARGO_CACHE_DIR=$CARGO_CACHE_DIR" >> $GITHUB_ENV
          echo "TARGET_CACHE_DIR=$TARGET_CACHE_DIR" >> $GITHUB_ENV
          
          echo "cache-key=$CACHE_KEY" >> $GITHUB_OUTPUT
          
          mkdir -p "$CARGO_CACHE_DIR"/{registry,git} "$TARGET_CACHE_DIR"

      - name: Install Rust
        uses: BTCDecoded/rust-ci/install-rust-toolchain@main

  test:
    name: Test
    needs: setup
    runs-on: [self-hosted, Linux, X64, builds]
    if: |
      (github.event_name != 'push' || github.event.head_commit == null || 
       (!contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[ci skip]') &&
        !contains(github.event.head_commit.message, '[no ci]'))) &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_tests != 'true')
    steps:
      - uses: actions/checkout@v4
      

      - name: Strip [patch.crates-io] for crates.io-only CI
        uses: BTCDecoded/rust-ci/strip-patch-crates-io@main
      - name: Cache
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: bind-env
          cache-key: ${{ needs.setup.outputs.cache-key }}

      - name: Restore Cargo cache
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: restore

      - name: Install Rust
        uses: BTCDecoded/rust-ci/install-rust-toolchain@main
      
      - name: Run tests with coverage
        run: |
          # Install tarpaulin
          cargo install cargo-tarpaulin --version 0.27.0
          
          # Run tests with coverage in one step
          # Use --lib --bins --tests to ensure all test types run
          # Use --skip-clean to reuse cached build artifacts, --timeout to prevent hangs
          cargo tarpaulin --lib --bins --tests --out xml --output-dir coverage --skip-clean --timeout 120
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: coverage/cobertura.xml
      
      - name: Save Cargo cache
        if: always()
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: save

      - name: Prune old runner caches
        if: always()
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: prune

  clippy:
    name: Clippy
    needs: setup
    runs-on: [self-hosted, Linux, X64, builds]
    if: |
      (github.event_name != 'push' || github.event.head_commit == null || 
       (!contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[ci skip]') &&
        !contains(github.event.head_commit.message, '[no ci]'))) &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_tests != 'true')
    steps:
      - uses: actions/checkout@v4
      

      - name: Strip [patch.crates-io] for crates.io-only CI
        uses: BTCDecoded/rust-ci/strip-patch-crates-io@main
      - name: Cache
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: bind-env
          cache-key: ${{ needs.setup.outputs.cache-key }}
          include-target: false

      - name: Restore Cargo cache
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: restore

      - name: Install Rust
        uses: BTCDecoded/rust-ci/install-rust-toolchain@main
      
      - name: Run clippy
        run: |
          if ! cargo clippy --version >/dev/null 2>&1; then
            echo "Skipping Clippy (cargo-clippy not installed for the active toolchain)"
            exit 0
          fi
          cargo clippy --lib --bins --all-features -- -D warnings

  fmt:
    name: Format
    needs: setup
    runs-on: [self-hosted, Linux, X64, builds]
    if: |
      (github.event_name != 'push' || github.event.head_commit == null || 
       (!contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[ci skip]') &&
        !contains(github.event.head_commit.message, '[no ci]'))) &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_tests != 'true')
    steps:
      - uses: actions/checkout@v4
      

      - name: Strip [patch.crates-io] for crates.io-only CI
        uses: BTCDecoded/rust-ci/strip-patch-crates-io@main
      - name: Install Rust
        uses: BTCDecoded/rust-ci/install-rust-toolchain@main
      
      - name: Check formatting
        run: |
          if ! cargo fmt --version >/dev/null 2>&1; then
            echo "Skipping rustfmt (not installed for the active toolchain)"
            exit 0
          fi
          cargo fmt --all -- --check

  docs:
    name: Docs
    needs: setup
    runs-on: [self-hosted, Linux, X64, builds]
    if: |
      (github.event_name != 'push' || github.event.head_commit == null || 
       (!contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[ci skip]') &&
        !contains(github.event.head_commit.message, '[no ci]'))) &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_tests != 'true')
    steps:
      - uses: actions/checkout@v4
      

      - name: Strip [patch.crates-io] for crates.io-only CI
        uses: BTCDecoded/rust-ci/strip-patch-crates-io@main
      - name: Cache
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: bind-env
          cache-key: ${{ needs.setup.outputs.cache-key }}
          include-target: false

      - name: Restore Cargo cache
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: restore

      - name: Install Rust
        uses: BTCDecoded/rust-ci/install-rust-toolchain@main
      
      - name: Build docs
        run: cargo doc --no-deps
      
      - name: Check docs
        run: cargo doc --no-deps --document-private-items

  security:
    name: Security
    needs: setup
    runs-on: [self-hosted, Linux, X64, builds]
    if: |
      (github.event_name != 'push' || github.event.head_commit == null || 
       (!contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[ci skip]') &&
        !contains(github.event.head_commit.message, '[no ci]')))
    steps:
      - uses: actions/checkout@v4
      

      - name: Strip [patch.crates-io] for crates.io-only CI
        uses: BTCDecoded/rust-ci/strip-patch-crates-io@main
      - name: Install Rust
        uses: BTCDecoded/rust-ci/install-rust-toolchain@main
      
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked
      
      - name: Run security audit
        run: cargo audit

  fuzz:
    name: Fuzz (${{ matrix.target }})
    needs: [setup, test]
    runs-on: [self-hosted, Linux, X64, builds]
    timeout-minutes: 30
    if: |
      (github.event_name != 'push' || github.event.head_commit == null || 
       (!contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[ci skip]') &&
        !contains(github.event.head_commit.message, '[no ci]'))) &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_tests != 'true')
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target:
          - sdk_governance_keys
          - sdk_parse_roundtrip
    steps:
      - uses: actions/checkout@v4

      - name: Strip [patch.crates-io] for crates.io-only CI
        uses: BTCDecoded/rust-ci/strip-patch-crates-io@main

      - name: Cache
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: bind-env
          cache-key: ${{ needs.setup.outputs.cache-key }}

      - name: Restore Cargo cache
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: restore

      - name: Install Rust
        uses: BTCDecoded/rust-ci/install-rust-toolchain@main

      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo install cargo-fuzz

      - name: Initialize corpus dirs
        working-directory: fuzz
        run: |
          chmod +x init_corpus.sh
          ./init_corpus.sh

      - name: Run cargo-fuzz (${{ matrix.target }})
        working-directory: fuzz
        env:
          RUSTFLAGS: "-Cpasses=sancov-module -Cllvm-args=-sanitizer-coverage-level=4"
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          timeout 240 cargo +nightly fuzz run "${{ matrix.target }}" -- -max_total_time=120 -timeout=10 -max_len=65536

      - name: Save Cargo cache
        if: always()
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: save

  build:
    name: Build
    needs: 
      - setup
      - test
      - clippy
      - fmt
      - docs
      - security
      - fuzz
    runs-on: [self-hosted, Linux, X64, builds]
    if: |
      always() &&
      needs.setup.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch') &&
      (github.event_name != 'push' || github.event.head_commit == null || 
       (!contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[ci skip]') &&
        !contains(github.event.head_commit.message, '[no ci]'))) &&
      ((github.event_name == 'workflow_dispatch' && github.event.inputs.skip_tests == 'true') ||
       (needs.test.result == 'success' && needs.clippy.result == 'success' && 
        needs.fmt.result == 'success' && needs.docs.result == 'success' && 
        needs.security.result == 'success' &&
        (needs.fuzz.result == 'success' || needs.fuzz.result == 'skipped')))
    steps:
      - uses: actions/checkout@v4
      

      - name: Strip [patch.crates-io] for crates.io-only CI
        uses: BTCDecoded/rust-ci/strip-patch-crates-io@main
      - name: Cache
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: bind-env
          cache-key: ${{ needs.setup.outputs.cache-key }}

      - name: Restore Cargo cache
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: restore

      - name: Install Rust
        uses: BTCDecoded/rust-ci/install-rust-toolchain@main
      
      - name: Build
        run: cargo build --release
      
      - name: Cache target
        if: always()
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: save
          save-target-only: true

  release:
    name: Release
    needs: [build, test, clippy, fmt, docs, security]
    runs-on: [self-hosted, Linux, X64, builds]
    if: |
      always() &&
      needs.build.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      (github.event.head_commit == null || 
       (!contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[ci skip]') &&
        !contains(github.event.head_commit.message, '[no ci]') &&
        !contains(github.event.head_commit.message, '[skip release]'))) &&
      ((github.event_name == 'workflow_dispatch' && github.event.inputs.skip_tests == 'true') ||
       (needs.test.result == 'success' && needs.clippy.result == 'success' && 
        needs.fmt.result == 'success' && needs.docs.result == 'success' && 
        needs.security.result == 'success'))
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      

      - name: Strip [patch.crates-io] for crates.io-only CI
        uses: BTCDecoded/rust-ci/strip-patch-crates-io@main
      - name: Install Rust
        uses: BTCDecoded/rust-ci/install-rust-toolchain@main
      
      - name: Determine version
        id: version
        run: |
          # Extract current version from [package] section
          CURRENT=$(grep -A 10 '^\[package\]' Cargo.toml | grep '^version = ' | head -1 | sed -E 's/^version = "([^"]+)".*/\1/')
          if [ -z "$CURRENT" ]; then
            echo "❌ Could not determine current version from Cargo.toml"
            grep -A 10 '^\[package\]' Cargo.toml | head -10
            exit 1
          fi
          echo "Current version: ${CURRENT}"
          if ! echo "$CURRENT" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ Invalid version format: ${CURRENT} (expected X.Y.Z)"
            exit 1
          fi
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          PATCH=$((PATCH + 1))

          # Same version tag for blvm-sdk and blvm-sdk-macros; both must be free on crates.io.
          # Fetch all published versions for each crate once upfront.
          fetch_versions() {
            local crate="$1"
            local resp
            resp=$(curl -sf \
              -H "User-Agent: blvm-ci/1.0 (github.com/BTCDecoded)" \
              "https://crates.io/api/v1/crates/${crate}/versions" 2>/dev/null || echo "")
            if [ -n "$resp" ] && ! echo "$resp" | grep -q '"detail"'; then
              if command -v jq &>/dev/null; then
                echo "$resp" | jq -r '.versions[].num' 2>/dev/null || echo ""
              else
                echo "$resp" | grep -oE '"num":"[^"]+"' | sed 's/"num":"//;s/"//'
              fi
            fi
          }
          echo "Fetching published versions for blvm-sdk and blvm-sdk-macros..."
          SDK_VERSIONS=$(fetch_versions "blvm-sdk")
          MACROS_VERSIONS=$(fetch_versions "blvm-sdk-macros")
          echo "blvm-sdk: $(echo "$SDK_VERSIONS" | wc -l | tr -d ' ') versions, blvm-sdk-macros: $(echo "$MACROS_VERSIONS" | wc -l | tr -d ' ') versions"

          MAX_ATTEMPTS=10
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
            EXISTS_SDK=false
            EXISTS_MACROS=false
            echo "$SDK_VERSIONS" | grep -qxF "$VERSION" && EXISTS_SDK=true
            echo "$MACROS_VERSIONS" | grep -qxF "$VERSION" && EXISTS_MACROS=true
            if [ "$EXISTS_SDK" = true ] || [ "$EXISTS_MACROS" = true ]; then
              echo "⚠️  blvm-sdk (${EXISTS_SDK}) or blvm-sdk-macros (${EXISTS_MACROS}) already has v${VERSION}; bumping patch..."
              PATCH=$((PATCH + 1))
              ATTEMPT=$((ATTEMPT + 1))
            else
              echo "✅ v${VERSION} is available for both crates"
              break
            fi
          done
          if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
            echo "❌ Failed to find available version after ${MAX_ATTEMPTS} attempts"
            exit 1
          fi
          
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "✅ Releasing version: ${VERSION}"
      
      - name: Get latest blvm-node version from crates.io
        id: node-version
        run: |
          set -euo pipefail
          API_RESPONSE=$(curl -sf \
            -H "User-Agent: blvm-sdk-ci/1.0 (github.com/BTCDecoded/blvm-sdk)" \
            "https://crates.io/api/v1/crates/blvm-node" || echo "")
          NODE_VER=""
          if command -v jq >/dev/null 2>&1; then
            NODE_VER=$(echo "$API_RESPONSE" | jq -r '.crate.max_version // empty')
          else
            NODE_VER=$(echo "$API_RESPONSE" | grep -oE '"max_version":"[^"]+"' | head -1 | sed 's/.*"max_version":"//;s/"$//')
          fi
          if [ -z "$NODE_VER" ] || [ "$NODE_VER" = "null" ]; then
            echo "❌ blvm-node not found on crates.io (API). It must be published first."
            exit 1
          fi
          echo "version=${NODE_VER}" >> $GITHUB_OUTPUT
          echo "Using blvm-node crates.io max_version: ${NODE_VER}"
      
      - name: Update Cargo.toml to use crates.io dependencies
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          NODE_VER="${{ steps.node-version.outputs.version }}"
          
          bump_package_version_in_file() {
            local file="$1"
            local ver="$2"
            awk -v ver="$ver" '
              BEGIN { in_package = 0 }
              /^\[package\]/ { in_package = 1; print; next }
              in_package && /^\[/ { in_package = 0 }
              in_package && /^version = / {
                print "version = \"" ver "\""
                next
              }
              { print }
            ' "$file" > "${file}.tmp.$$" && mv "${file}.tmp.$$" "$file"
          }

          bump_package_version_in_file "Cargo.toml" "$VERSION"
          bump_package_version_in_file "crates/blvm-sdk-macros/Cargo.toml" "$VERSION"

          # Pin macros to exact published version while keeping path (workspace publish layout).
          awk -v ver="$VERSION" '
            /^blvm-sdk-macros = / {
              print "blvm-sdk-macros = { version = \"=" ver "\", path = \"crates/blvm-sdk-macros\" }"
              next
            }
            { print }
          ' Cargo.toml > Cargo.toml.dep.$$ && mv Cargo.toml.dep.$$ Cargo.toml

          # Optional blvm-node: pin to released crates.io version (quoted semver in TOML).
          awk -v nv="$NODE_VER" '
            /^blvm-node = .*optional = true/ {
              print "blvm-node = { version = \"" nv "\", optional = true }"
              next
            }
            { print }
          ' Cargo.toml > Cargo.toml.node.$$ && mv Cargo.toml.node.$$ Cargo.toml

          actual_root=$(grep -A 8 '^\[package\]' Cargo.toml | grep '^version = ' | head -1 | sed -E 's/^version = "([^"]+)".*/\1/')
          actual_macros=$(grep -A 8 '^\[package\]' crates/blvm-sdk-macros/Cargo.toml | grep '^version = ' | head -1 | sed -E 's/^version = "([^"]+)".*/\1/')
          if [ "$actual_root" != "$VERSION" ] || [ "$actual_macros" != "$VERSION" ]; then
            echo "❌ Version bump verification failed (root=${actual_root} macros=${actual_macros} expected=${VERSION})"
            exit 1
          fi
          echo "✅ Manifest versions verified at ${VERSION}"
          
          echo "Updated manifests for release ${VERSION}:"
          grep -E "^version = " Cargo.toml crates/blvm-sdk-macros/Cargo.toml | head -5
          grep "blvm-sdk-macros = " Cargo.toml | head -1
          grep -E "^blvm-node" Cargo.toml | head -1
      
      - name: Check for crates.io token
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "⚠️  CARGO_REGISTRY_TOKEN not set, skipping crate publication"
            echo "   Set CARGO_REGISTRY_TOKEN secret to enable crate publishing"
            exit 0
          fi
      
      - name: Configure cargo for crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo login "${CARGO_REGISTRY_TOKEN}"
      
      - name: Verify package manifests
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: |
          (cd crates/blvm-sdk-macros && cargo package --list)
          cargo package --list
      
      - name: Dry-run publish (macros, then SDK)
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: |
          (cd crates/blvm-sdk-macros && cargo publish --dry-run --no-verify --allow-dirty)
          cargo publish --dry-run --no-verify --allow-dirty
      
      - name: Check if versions already on crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        id: check-version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for CRATE in blvm-sdk-macros blvm-sdk; do
            API_RESPONSE=$(curl -s --max-time 10 "https://crates.io/api/v1/crates/${CRATE}/versions" 2>/dev/null || echo "")
            EXISTS=false
            if [ -n "$API_RESPONSE" ] && ! echo "$API_RESPONSE" | grep -q '"detail"'; then
              if command -v jq &> /dev/null; then
                V=$(echo "$API_RESPONSE" | jq -r ".versions[] | select(.num == \"${VERSION}\") | .num" | head -1)
                [ "$V" = "$VERSION" ] && EXISTS=true
              elif echo "$API_RESPONSE" | grep -q "\"num\":\"${VERSION}\""; then
                EXISTS=true
              fi
            fi
            if [ "$CRATE" = "blvm-sdk-macros" ]; then
              echo "macros_exists=${EXISTS}" >> $GITHUB_OUTPUT
            else
              echo "sdk_exists=${EXISTS}" >> $GITHUB_OUTPUT
            fi
            echo "  ${CRATE} v${VERSION} exists on crates.io: ${EXISTS}"
          done
      
      - name: Publish blvm-sdk-macros to crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        id: publish_macros
        run: |
          set +e
          VERSION="${{ steps.version.outputs.version }}"
          if [ "${{ steps.check-version.outputs.macros_exists }}" = "true" ]; then
            echo "Skipping blvm-sdk-macros (already published)"
            echo "published=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          OUT=$(cd crates/blvm-sdk-macros && cargo publish --no-verify --allow-dirty --token "${CARGO_REGISTRY_TOKEN}" 2>&1)
          CODE=$?
          echo "$OUT"
          if [ $CODE -eq 0 ]; then
            echo "published=true" >> $GITHUB_OUTPUT
            echo "Waiting 45s for crates.io to index blvm-sdk-macros..."
            sleep 45
          elif echo "$OUT" | grep -qi "already exists"; then
            echo "::error::blvm-sdk-macros publish rejected (version already exists) — version check was wrong or index race"
            echo "published=false" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "published=false" >> $GITHUB_OUTPUT
            echo "::error::cargo publish failed for blvm-sdk-macros (see log above)"
            exit 1
          fi
      
      - name: Publish blvm-sdk to crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        id: publish_sdk
        run: |
          set +e
          VERSION="${{ steps.version.outputs.version }}"
          if [ "${{ steps.check-version.outputs.sdk_exists }}" = "true" ]; then
            echo "Skipping blvm-sdk (already published)"
            echo "published=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          OUT=$(cargo publish --no-verify --allow-dirty --token "${CARGO_REGISTRY_TOKEN}" 2>&1)
          CODE=$?
          echo "$OUT"
          if [ $CODE -eq 0 ]; then
            echo "published=true" >> $GITHUB_OUTPUT
            echo "Waiting 30s for crates.io to index blvm-sdk..."
            sleep 30
          elif echo "$OUT" | grep -qi "already exists"; then
            echo "::error::blvm-sdk publish rejected (version already exists) — version check was wrong or index race"
            echo "published=false" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "published=false" >> $GITHUB_OUTPUT
            echo "::error::cargo publish failed for blvm-sdk (see log above)"
            exit 1
          fi
      
      - name: Verify published crates on crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for CRATE in blvm-sdk-macros blvm-sdk; do
            echo "Verifying ${CRATE} v${VERSION}..."
            RETRY=0
            while [ $RETRY -lt 5 ]; do
              if cargo search "$CRATE" --limit 1 2>/dev/null | grep -q "${VERSION}"; then
                echo "✅ https://crates.io/crates/${CRATE}/${VERSION}"
                break
              fi
              RETRY=$((RETRY + 1))
              [ $RETRY -lt 5 ] && sleep 10
            done
          done
